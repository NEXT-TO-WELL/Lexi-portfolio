# https://www.playframework.com/documentation/latest/Configuration

# Modules
play.modules.enabled += "modules.JobModule"
play.modules.enabled += "play.api.db.slick.SlickModule"

jobs.trends.enabled = true

# Database
# Development defaults. Production values are supplied through environment
# variables in production.conf (DB_URL, DB_USER, DB_PASSWORD).
slick.dbs.default.profile = "slick.jdbc.MySQLProfile$"
slick.dbs.default.db.driver = "com.mysql.cj.jdbc.Driver"
slick.dbs.default.db.url = "jdbc:mysql://localhost:3306/lexi_db?serverTimezone=Asia/Tokyo&useUnicode=true&characterEncoding=UTF-8"
slick.dbs.default.db.url = ${?DB_URL}
slick.dbs.default.db.user = "lexi_dev"
slick.dbs.default.db.user = ${?DB_USER}
slick.dbs.default.db.password = "CHANGE_ME_DEV_DB_PASSWORD"
slick.dbs.default.db.password = ${?DB_PASSWORD}

# Connection pool
slick.dbs.default.db.numThreads = 20
slick.dbs.default.db.maxConnections = 20
slick.dbs.default.db.minConnections = 5
slick.dbs.default.db.connectionTimeout = 30000
slick.dbs.default.db.idleTimeout = 600000
slick.dbs.default.db.maxLifetime = 1800000
slick.dbs.default.db.leakDetectionThreshold = 60000

# Slick async executor
slick.dbs.default.db.queueSize = 1000

# Play Evolutions manages the database schema. Enable auto-apply in production
# only after taking a backup: EVOLUTIONS_AUTO_APPLY=true.
play.evolutions.db.default {
  enabled = true
  autoApply = false
  autoApply = ${?EVOLUTIONS_AUTO_APPLY}
  autoApplyDowns = false
  useLocks = true
}

# Application authentication
jwt {
  secret = "CHANGE_ME_DEV_JWT_SECRET_MIN_32_CHARS"
  secret = ${?JWT_SECRET}
  issuer = "example-api"
  expiryInSeconds = 86400
}

# Optional admin secret. The application falls back to jwt.secret when absent.
admin.jwt {
  secret = ${?ADMIN_JWT_SECRET}
}

web-push {
  enabled = false
  enabled = ${?WEB_PUSH_ENABLED}
  vapid {
    public-key = ""
    public-key = ${?WEB_PUSH_VAPID_PUBLIC_KEY}
    private-key = ""
    private-key = ${?WEB_PUSH_VAPID_PRIVATE_KEY}
    subject = "mailto:admin@example.com"
    subject = ${?WEB_PUSH_VAPID_SUBJECT}
  }
}

# Development host and request filters
play.filters.hosts {
  allowed = ["."]
}

play.http.filters = "filters.Filters"
play.filters.enabled += "play.filters.cors.CORSFilter"

# Forwarded headers are ignored unless the direct peer belongs to one of these
# networks. Production supplies private proxy CIDRs through the environment.
security.trusted-proxies = []
security.trusted-proxies-from-environment = ${?TRUSTED_PROXY_CIDRS}

rate-limit.enabled = true

# Disabled in development; production.conf enables this filter.
admin.ip.filter.enabled = false
admin.allowed.ips = []

# HTTP parser limits and encoding
play.http.parser.maxMemoryBuffer = 10MB
play.http.parser.maxDiskBuffer = 100MB
play.http.parser.tolerantText.charset = "UTF-8"

# Play default execution context
play.server.akka {
  default-dispatcher {
    fork-join-executor {
      parallelism-factor = 2.0
      parallelism-min = 8
      parallelism-max = 64
    }
  }
}
