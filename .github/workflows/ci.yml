name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and build assets
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lexi_test_db
          MYSQL_USER: lexi_user
          MYSQL_PASSWORD: lexi-ci-password
          MYSQL_ROOT_PASSWORD: lexi-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plexi-ci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/lexi_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/lexi_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
      DB_USER: lexi_user
      DB_PASSWORD: lexi-ci-password
      JWT_SECRET: ci-jwt-secret-not-used-outside-ci

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1
        with:
          disk-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install frontend build tools
        run: npm ci

      - name: Check Scala formatting
        run: npm run format:check

      - name: Lint Scala sources
        run: npm run lint:check

      - name: Build Scala.js applications
        run: sbt -batch frontend/fastLinkJS auth/fastLinkJS manager/fastLinkJS

      - name: Run Scala.js tests
        run: sbt -batch frontend/test

      - name: Generate Tailwind CSS
        run: npm run css:build

      - name: Verify generated CSS is committed
        run: git diff --exit-code -- public/stylesheets/main.css

      - name: Compile Play application
        run: sbt -batch compile

      - name: Run backend tests
        run: sbt -batch test

      - name: Install Chromium for E2E tests
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload E2E failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
