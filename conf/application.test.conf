include "application.conf"

# Integration tests must never use the development database.
slick.dbs.default.db.url = "jdbc:mysql://localhost:3306/lexi_test_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8"
slick.dbs.default.db.url = ${?TEST_DB_URL}

# The application user credentials are inherited from DB_USER and DB_PASSWORD.
# TEST_DB_URL can point to a dedicated database server when required.
play.evolutions.db.default.autoApply = true
play.evolutions.db.default.autoApplyDowns = true

# Background trend updates are not part of request or repository integration tests.
jobs.trends.enabled = false

# Local notification credentials must not change deterministic test behavior.
web-push.enabled = false

# Tests connect directly and never trust forwarding headers from the shell environment.
security.trusted-proxies = []
security.trusted-proxies-from-environment = ""

# Browser and integration suites share one loopback IP and must not influence each other.
rate-limit.enabled = false
